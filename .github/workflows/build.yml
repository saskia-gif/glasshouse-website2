# Rebuilds the site whenever content changes, and publishes it.
#
# You never run this. Save something in /admin, and about two minutes later
# the live site has been regenerated with fresh titles, descriptions,
# canonicals, breadcrumbs, structured data and sitemap.
name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the browser used to render each page
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Generate the site
        run: python3 build/generate.py

      - name: Check every page came out
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          echo "pages built: $(find dist -name index.html | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
